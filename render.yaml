services:
  - type: web
    name: recallai
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: recallai-database
          property: connectionString
      - key: RECALLAI_JWT_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: RECALLAI_JWT_EXPIRE_MINUTES
        value: "60"
      - key: GEMINI_MODEL
        value: gemini-3.6-flash

databases:
  - name: recallai-database
    plan: free
